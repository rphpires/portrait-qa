<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portrait QA</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2230; --muted:#5d6678; --line:#dde1e8; --accent:#2f6fde;
          --ok:#1f8a4c; --warn:#b7791f; --err:#c53030; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --card:#1b2029; --text:#e6e9ef; --muted:#98a2b3; --line:#2c3341; --accent:#6ea0ff;
            --ok:#4cc38a; --warn:#e0a84a; --err:#f07272; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { margin:0 0 20px; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .controls { display:flex; flex-wrap:wrap; gap:12px; align-items:end; margin-bottom:16px; }
  label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); }
  select, input[type=text], input[type=password] { font:inherit; padding:7px 9px; border:1px solid var(--line);
          border-radius:6px; background:var(--bg); color:var(--text); min-width:150px; }
  #drop { border:2px dashed var(--line); border-radius:10px; padding:28px; text-align:center; cursor:pointer;
          color:var(--muted); }
  #drop.over { border-color:var(--accent); color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:16px; margin-top:16px; }
  .grid img { max-width:100%; max-height:420px; display:block; margin:0 auto; border-radius:6px; }
  .verdict { font-size:20px; font-weight:600; }
  .pass { color:var(--ok); } .fail { color:var(--err); }
  ul.issues { padding-left:18px; margin:8px 0 0; }
  li.error { color:var(--err); } li.warning { color:var(--warn); }
  pre { white-space:pre-wrap; word-break:break-all; font-size:12px; max-height:360px; overflow:auto;
        background:var(--bg); padding:10px; border-radius:6px; margin:0; }
  .muted { color:var(--muted); font-size:13px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Portrait QA</h1>
  <p class="sub">Test page: drop a photo to see what the API returns. API reference: <a href="/docs">/docs</a>.</p>
  <div class="card">
    <div class="controls">
      <label>Endpoint
        <select id="endpoint">
          <option value="process">POST /v1/process (check, crop if it passes)</option>
          <option value="assess">POST /v1/assess (check only)</option>
          <option value="crop">POST /v1/crop (always crop)</option>
        </select>
      </label>
      <label>Profile <select id="profile"></select></label>
      <label id="keybox" hidden>API key <input id="key" type="password" autocomplete="off"></label>
    </div>
    <div id="drop">Drop a photo here or click to choose (JPEG, PNG, BMP, WebP)
      <input id="file" type="file" accept="image/*" hidden></div>
  </div>
  <div class="grid" id="out" hidden>
    <div class="card"><div class="muted">Sent</div><img id="src" alt="sent photo"></div>
    <div class="card"><div id="verdict" class="verdict"></div><div id="summary" class="muted"></div>
      <ul class="issues" id="issues"></ul><div id="cropbox" hidden><div class="muted" style="margin-top:12px">Cropped</div>
      <img id="crop" alt="cropped portrait"></div></div>
    <div class="card"><div class="muted">Response</div><pre id="json"></pre></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let lastFile = null;
async function init() {
  try {
    const h = await (await fetch("/v1/health")).json();
    $("keybox").hidden = !h.auth_required;
    const r = await fetch("/v1/profiles", { headers: headers() });
    if (r.ok) {
      const p = await r.json();
      $("profile").innerHTML = p.profiles.map(x =>
        `<option value="${x.name}" ${x.name === p.default ? "selected" : ""}>${x.name} (${x.width}x${x.height})</option>`).join("");
    }
  } catch (e) { console.error(e); }
}
function headers() { const k = $("key").value.trim(); return k ? { "X-API-Key": k } : {}; }
async function send(file) {
  lastFile = file;
  $("out").hidden = false;
  $("src").src = URL.createObjectURL(file);
  $("verdict").textContent = "Checking…"; $("verdict").className = "verdict";
  $("summary").textContent = ""; $("issues").innerHTML = ""; $("cropbox").hidden = true; $("json").textContent = "";
  const form = new FormData(); form.append("image", file);
  const ep = $("endpoint").value;
  const q = ep === "assess" ? "" : `?profile=${encodeURIComponent($("profile").value)}`;
  const r = await fetch(`/v1/${ep}${q}`, { method: "POST", body: form, headers: headers() });
  const data = await r.json();
  const shown = structuredClone(data);
  if (shown.crop && shown.crop.image_base64) shown.crop.image_base64 = shown.crop.image_base64.slice(0, 60) + "…";
  $("json").textContent = JSON.stringify(shown, null, 2);
  if (!r.ok) {
    $("verdict").textContent = `${r.status} ${data.error.code}`; $("verdict").className = "verdict fail";
    $("summary").textContent = data.error.message; return;
  }
  $("verdict").textContent = data.passed ? `Passed · ${data.score}` : `Failed · ${data.score}`;
  $("verdict").className = "verdict " + (data.passed ? "pass" : "fail");
  $("summary").textContent = `${data.faces} face(s) · ${data.image_size.join("x")} · ${data.elapsed_ms} ms`;
  $("issues").innerHTML = data.issues.map(i => `<li class="${i.severity}"><b>${i.code}</b>: ${i.message}</li>`).join("")
    || "<li>No issues.</li>";
  if (data.crop) {
    $("crop").src = "data:image/jpeg;base64," + data.crop.image_base64; $("cropbox").hidden = false;
    $("summary").textContent += ` · crop ${data.crop.width}x${data.crop.height}, ${(data.crop.bytes / 1024).toFixed(0)} KB`;
  }
}
const drop = $("drop");
drop.onclick = () => $("file").click();
$("file").onchange = (e) => e.target.files[0] && send(e.target.files[0]);
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); e.dataTransfer.files[0] && send(e.dataTransfer.files[0]); };
$("endpoint").onchange = $("profile").onchange = () => lastFile && send(lastFile);
$("key").onchange = () => { init(); lastFile && send(lastFile); };
init();
</script>
</body>
</html>

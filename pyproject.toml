[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "portrait-qa"
dynamic = ["version"]
description = "Face photo quality check and portrait crop as a local HTTP service, with a Windows setup window."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "portrait_qa/models/LICENSE-yunet"]
authors = [{ name = "Raphael Pires" }]
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.10,<6",
    "numpy>=1.26",
    "pillow>=10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pywin32>=306; sys_platform == 'win32'",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Framework :: FastAPI",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
build = ["pyinstaller>=6"]

[project.scripts]
portrait-qa = "portrait_qa.cli:main"

[tool.setuptools.dynamic]
version = { attr = "portrait_qa.__version__" }

[tool.setuptools.packages.find]
include = ["portrait_qa*"]

[tool.setuptools.package-data]
portrait_qa = ["models/*", "web/*", "assets/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM105", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
pythonpath = ["."]
